<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanguard - Profile / Settings</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="gov-header">
        <div class="gov-container">
            <a href="index.html" class="gov-header-brand">
                <h1 class="gov-header-title">Vanguard</h1>
            </a>
        </div>
    </header>

    <main class="gov-container">
        <!-- Overlay Card / User Profile Widget -->
        <div class="gov-login-wrapper">
            <div class="gov-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--gov-spacing-md);">
                    <div>
                        <h3 style="margin: 0;">NAME LASTNAME</h3>
                        <p class="gov-hint" style="margin: 0;">USER</p>
                    </div>
                    <span class="gov-badge gov-badge-primary">CUSTOM BIO</span>
                </div>

                <div class="gov-form-group" style="border: 1px solid var(--gov-border-color); padding: 1rem; border-radius: var(--gov-border-radius); text-align: center; margin-bottom: var(--gov-spacing-lg);">
                    <p style="margin: 0; font-weight: 600;">CUSTOM DESCRIPTION</p>
                </div>

                <div style="display: flex; justify-content: space-between; gap: var(--gov-spacing-sm);">
                    <a href="index.html" class="gov-btn gov-btn-secondary" style="width: auto;">PASSWORD CON</a>
                    <a href="index.html" class="gov-btn gov-btn-primary" style="width: auto;">SAVE</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="gov-footer">
        <div class="gov-container">
            <ul class="gov-footer-links">
                <li><a href="#">Ayuda</a></li>
                <li><a href="#">Términos y Condiciones</a></li>
            </ul>
        </div>
    </footer>

</body>
</html>
